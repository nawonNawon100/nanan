<!DOCTYPE html>
<html lang="ko">
<head>
  <script>document.documentElement.classList.add("js")</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>조언이 있는 할 일 목록 | 나원 포트폴리오</title>
  <meta name="description" content="오늘의 조언과 함께 쓰는 할 일 목록">
  <meta property="og:title" content="조언이 있는 할 일 목록 | 나원 포트폴리오">
  <meta property="og:description" content="오늘의 조언과 함께 쓰는 할 일 목록">
  <meta property="og:image" content="../images/profile.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="../index.html">나원<span>.</span></a>
      <nav aria-label="주 메뉴">
        <button class="menu-btn" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav-list">☰</button>
        <ul class="nav-list" id="nav-list">
          <li><a href="../index.html">소개</a></li>
          <li><a href="../works.html" aria-current="page">작품</a></li>
          <li><a href="../contact.html">연락처</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 760px">
      <p class="eyebrow reveal"><a href="../works.html" style="text-decoration:none">← 작품 목록</a></p>
      <h1 class="section-title reveal">조언이 있는 할 일 목록</h1>

      <!-- 맨 위: 오늘의 조언 (advice.js가 동작시켜요) -->
      <section class="advice-widget reveal" data-advice aria-labelledby="todo-advice-title">
        <h2 class="advice-label" id="todo-advice-title" style="font-size:1rem">오늘의 조언</h2>
        <p class="advice-text is-empty" data-advice-text aria-live="polite">버튼을 눌러 오늘의 조언을 받아 보세요.</p>
        <div class="advice-actions">
          <button class="btn btn-outline" type="button" data-advice-btn>새 조언 받기</button>
        </div>
        <p class="advice-msg" data-advice-msg role="status"></p>
      </section>

      <!-- 할 일 목록 (todo.js가 동작시켜요) -->
      <section class="todo-box reveal" aria-labelledby="todo-title">
        <h2 id="todo-title" style="font-size:1.25rem">오늘 할 일</h2>
        <form class="todo-form" id="todo-form">
          <label for="todo-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">할 일</label>
          <input type="text" id="todo-input" placeholder="할 일을 입력하세요" maxlength="100" autocomplete="off">
          <button class="btn btn-primary" type="submit">추가</button>
        </form>
        <p class="advice-msg" id="todo-msg" role="status"></p>
        <p class="todo-count" id="todo-count"></p>
        <ul class="todo-list" id="todo-list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 나원 · <span class="placeholder">[여기에 입력: 이메일]</span></span>
      <span>Made with Claude Code</span>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="../js/advice.js"></script>
  <script src="../js/todo.js"></script>
</body>
</html>
