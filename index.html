<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않게 해주는 설정 -->
  <meta charset="UTF-8">
  <!-- 휴대폰에서도 화면 크기에 맞게 보이게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>나원의 자기소개</title>

  <!-- 구글 폰트: 큰 제목용 명조(Gowun Batang), 본문용 고딕(Noto Sans KR) -->
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* ===== 색상표: 여기 색만 바꾸면 페이지 전체 색이 바뀌어요 ===== */
    :root {
      --배경: #ffffff;      /* 페이지 맨 위 색 */
      --배경끝: #000000;    /* 페이지 맨 아래 색 */
      --글자: #1b1b1b;
      --흐린글자: #8a8a8a;
      --주황: #e2733f;      /* 버튼, 카드 포인트 */
      --보라: #dcbcf2;      /* 연보라 카드 */
      --검정카드: #1b1b1b;  /* 검은 카드 배경 */
      --검정카드글자: #ffffff;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: inherit; }

    /* ===== 페이지 전체 ===== */
    body {
      margin: 0;
      /* 위(--배경)에서 아래(--배경끝)로 점점 검어지는 그라디언트 */
      background: linear-gradient(to bottom, var(--배경), var(--배경끝));
      min-height: 100vh;
      color: var(--글자);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: clamp(0.95rem, 0.9rem + 0.2vw, 1.05rem);
      line-height: 1.7;
      word-break: keep-all;  /* 한글 단어가 중간에서 끊기지 않게 */
    }
    main {
      width: 90%;
      max-width: 1080px;
      margin: 0 auto;
      padding-bottom: clamp(400px, 60vw, 900px);  /* 맨 아래 문장 밑의 빈 공간 */
    }
    /* 명조 글꼴을 쓰는 곳에 공통으로 붙이는 클래스 */
    .명조 { font-family: "Gowun Batang", "AppleMyungjo", "Batang", serif; font-weight: 400; }
    [hidden] { display: none !important; }  /* hidden이 붙은 건 확실히 숨기기 */

    /* ===== 떨어지는 입자를 그리는 캔버스: 화면에 고정, 글자와 카드 뒤에 ===== */
    #입자캔버스 {
      position: fixed;       /* 스크롤해도 화면에 붙어 있게 */
      inset: 0;              /* 화면 전체 */
      width: 100%;
      height: 100%;
      z-index: -1;           /* 페이지 내용 뒤로 */
      pointer-events: none;  /* 클릭은 그대로 아래 내용에 전달 */
    }

    /* ===== 맨 위 막대: 왼쪽 끝에 프로필 사진, 오른쪽 끝에 사진 고르기 버튼 ===== */
    .머리줄 {
      display: flex;
      justify-content: space-between;  /* 첫째는 왼쪽 끝, 둘째는 오른쪽 끝으로 */
      align-items: center;        /* 사진과 버튼의 세로 가운데 맞추기 */
      gap: 14px;
      padding: 20px 0;
    }

    /* 진짜 파일 선택 칸은 숨기고, label을 버튼처럼 꾸며요 */
    .사진입력 { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .사진버튼 {
      display: inline-block;
      cursor: pointer;
      background: var(--주황);
      color: #ffffff;
      font-weight: 500;
      font-size: 0.8rem;
      border-radius: 8px;
      padding: 8px 16px;
    }
    .사진버튼:hover { filter: brightness(1.06); }
    .사진입력:focus-visible + .사진버튼 { outline: 3px solid var(--글자); outline-offset: 3px; }

    /* ===== 큰 제목 영역 ===== */
    .큰제목 {
      text-align: center;
      padding: clamp(48px, 9vw, 110px) 0 clamp(72px, 12vw, 150px);  /* 아래 여백으로 음식 줄과 간격 두기 */
    }
    .큰제목 h1 {
      font-size: clamp(2.6rem, 9vw, 5.8rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .큰제목 h1 span { display: block; }
    /* 둘째 줄 글자: '사진 고르기' 버튼과 같은 주황색 */
    .큰제목 .주황글자 {
      color: var(--주황);
    }

    /* ===== 프로필 사진 (원형) ===== */
    .사진틀 {
      flex: none;
      width: clamp(76px, 10vw, 104px);
      aspect-ratio: 1;           /* 정사각형 */
      border-radius: 50%;        /* 원형 */
      overflow: hidden;
      background: var(--보라);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .사진틀 img { width: 100%; height: 100%; object-fit: cover; }
    .빈자리 { color: #1b1b1b; font-size: 0.68rem; line-height: 1.35; padding: 0 10px; }

    /* ===== 좋아하는 음식: 로고 줄처럼 한 줄로 ===== */
    .음식 { text-align: center; }
    .음식목록 {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      counter-reset: 순위;
    }
    .음식목록 li {
      counter-increment: 순위;
      font-weight: 700;
      font-size: clamp(1.05rem, 0.9rem + 0.8vw, 1.5rem);
      letter-spacing: -0.02em;
    }
    /* 순위 숫자를 작게 앞에 붙여요 */
    .음식목록 li::before {
      content: counter(순위);
      font-size: 0.55em;
      font-weight: 500;
      color: var(--흐린글자);
      vertical-align: super;
      margin-right: 4px;
    }
    /* 페이지 이동 링크: 파란 밑줄 대신 글자색, 마우스를 올리면 주황색 */
    .음식목록 a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    .음식목록 a:hover,
    .음식목록 a:focus-visible { color: var(--주황); }

    /* ===== 좋아하는 것들: 계단식 제목 ===== */
    .취미 { padding-top: clamp(80px, 12vw, 150px); }
    .계단제목 {
      font-size: clamp(2.4rem, 7.5vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      margin: 0 auto clamp(32px, 5vw, 56px);
      width: fit-content;
    }
    .계단제목 span { display: block; }
    .계단제목 { color: #000000; }  /* 세 줄 모두 검은색 */
    .계단제목 .첫줄 { font-size: 0.42em; }
    .계단제목 .셋째줄 { padding-left: 1.6em; }  /* 오른쪽으로 밀어서 계단 모양 */

    /* 카드 배치: 넓은 화면에서는 [설명 | 검은 카드 | 주황 카드] / [보라 카드] */
    .카드판 {
      display: grid;
      grid-template-columns: 1fr 1.7fr 1.2fr;
      gap: 10px;
    }
    .카드판 .설명 {
      font-size: 0.82rem;
      color: #ffffff;  /* 어두워진 배경 위라서 흰색 */
      align-self: center;
      padding-right: 12px;
      margin: 0;
    }
    .카드 {
      position: relative;
      border-radius: 22px;
      padding: 24px;
      min-height: clamp(220px, 26vw, 300px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;   /* 글자는 카드 아래쪽에 */
      overflow: hidden;
    }
    .카드 h3 { font-size: 1.35rem; margin: 0; line-height: 1.3; }
    .카드 svg {
      position: absolute;
      top: 22px; left: 22px;
      width: 52%;
      height: auto;
      max-height: 60%;
    }
    .카드.검정 { color: var(--검정카드글자); }
    .카드.검정 h3 { margin-left: auto; width: 45%; }   /* 오른쪽 아래에 글자 */

    /* ===== 이모티콘 카드: 글래스모피즘(유리 효과) =====
       검은 카드 위에 반투명 유리판(::after)을 한 겹 올려요. */

    /* 반투명 유리판: 뒤를 흐리게(blur) 비추고, 테두리에 빛 반사 */
    .카드.검정::after {
      content: "";
      position: absolute;
      inset: 14px;                                   /* 카드 가장자리에서 조금 안쪽 */
      z-index: 1;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.10);         /* 살짝 하얀 반투명 */
      -webkit-backdrop-filter: blur(22px) saturate(150%);  /* 사파리용 */
      backdrop-filter: blur(22px) saturate(150%);    /* 뒤쪽을 흐리게 */
      border: 1px solid rgba(255, 255, 255, 0.28);   /* 유리 테두리 */
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.35),     /* 윗면 빛 반사 */
        0 8px 24px rgba(0, 0, 0, 0.25);              /* 유리판 그림자 */
    }

    /* 그림과 글자는 유리판 위로 올려요 */
    .카드.검정 svg { z-index: 2; top: 36px; left: 36px; }
    .카드.검정 h3 { position: relative; z-index: 2; padding: 0 14px 14px 0; }

    /* 흐림 효과를 지원하지 않는 브라우저에서는 유리판을 조금 더 불투명하게 */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .카드.검정::after { background: rgba(40, 40, 40, 0.85); }
    }
    .카드.주황 { background: var(--주황); color: #ffffff; }
    .카드.주황 svg { left: auto; right: 22px; width: 62%; }
    .카드.보라 { background: var(--보라); color: #1b1b1b; grid-column: 1 / 3; }
    .카드.보라 svg { width: 34%; left: auto; right: 28px; }

    /* ===== 좋아하는 문장 ===== */
    .문장 { padding-top: clamp(80px, 12vw, 150px); text-align: center; }
    .문장 blockquote { margin: 0; }
    .문장 blockquote p {
      color: #ffffff;  /* 검은 배경 위라서 흰색 */
      font-size: clamp(2.2rem, 7vw, 4.4rem);
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin: 0 0 18px;
    }
    .문장 footer { font-size: 0.85rem; color: var(--흐린글자); }

    /* ===== 페이지 맨 아래: 눈밭 위의 작은 오두막 (CSS로만 그림) ===== */
    .눈밭 {
      --눈높이: clamp(56px, 8vw, 88px);   /* 쌓인 눈의 높이 (얕게) */
      --눈색: #f3f7fb;
      --눈그늘: #d3dee9;
      --나무: #7a5136;
      --나무진한: #5b3a26;
      --지붕색: #3a2a22;
      --창틀: #3b2618;
      position: relative;
      height: clamp(240px, 30vw, 340px);
      overflow: hidden;                  /* 화면 밖으로 넓게 깐 눈이 가로 스크롤을 만들지 않게 */
    }

    /* --- 오두막 전체 상자: 모든 크기를 em으로 정해서, font-size 하나로 크기 조절 --- */
    .오두막 {
      position: absolute;
      left: 50%;
      bottom: calc(var(--눈높이) - 1.6em);  /* 아랫부분이 눈에 살짝 파묻히게 */
      transform: translateX(-50%);
      font-size: clamp(9px, 1.1vw, 12px);   /* 이 값을 키우면 오두막 전체가 커져요 */
      width: 16em;
      height: 15em;
      z-index: 2;
    }

    /* 굴뚝: 지붕 뒤에서 솟아오르게 (지붕보다 아래 층) */
    .굴뚝 {
      position: absolute;
      left: 11em; top: 1.2em;
      width: 1.6em; height: 3.4em;
      background: var(--나무진한);
      z-index: 1;
    }
    .굴뚝::before {                         /* 굴뚝 위에 쌓인 눈 */
      content: "";
      position: absolute;
      left: -0.3em; right: -0.3em; top: -0.5em;
      height: 0.8em;
      background: var(--눈색);
      border-radius: 1em 1em 0.3em 0.3em;
    }

    /* 박공지붕: 삼각형 두 장을 겹쳐요.
       흰 삼각형(눈) 위에 같은 크기의 진한 삼각형을 조금 아래로 놓으면
       양쪽 비탈면을 따라 흰 띠가 남아서 '지붕 위에 쌓인 눈'처럼 보여요. */
    .지붕눈, .지붕 {
      position: absolute;
      left: 0;
      width: 16em; height: 7em;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);  /* 삼각형으로 자르기 */
    }
    .지붕눈 { top: 0; background: var(--눈색); z-index: 2; }
    .지붕 {
      top: 0.75em;
      background: linear-gradient(to bottom, #4a362b, var(--지붕색));
      z-index: 3;
    }

    /* 벽: 통나무 줄무늬 */
    .벽 {
      position: absolute;
      left: 2em; top: 7em;
      width: 12em; height: 8em;
      background: repeating-linear-gradient(
        to bottom,
        var(--나무) 0 0.9em,
        var(--나무진한) 0.9em 1em
      );
      z-index: 1;
    }

    /* 문 */
    .문 {
      position: absolute;
      right: 1.8em; bottom: 0;
      width: 3em; height: 5.2em;
      background: var(--창틀);
      border-radius: 0.4em 0.4em 0 0;
    }
    .문::after {                            /* 문고리 */
      content: "";
      position: absolute;
      left: 0.5em; top: 2.8em;
      width: 0.4em; height: 0.4em;
      border-radius: 50%;
      background: #e9b95a;
    }

    /* 불 켜진 창문: 노란 유리 + 십자 창살 + 은은한 빛 번짐 */
    .창문, .박공창 {
      position: absolute;
      background:
        linear-gradient(var(--창틀), var(--창틀)) center / 0.3em 100% no-repeat,  /* 세로 창살 */
        linear-gradient(var(--창틀), var(--창틀)) center / 100% 0.3em no-repeat,  /* 가로 창살 */
        radial-gradient(circle at 50% 55%, #fff3c4, #ffd36b 60%, #f2b247);       /* 노란 불빛 */
      box-shadow:
        0 0 0.8em 0.2em rgba(255, 205, 100, 0.55),
        0 0 2.4em 0.8em rgba(255, 190, 80, 0.25);
      animation: 불빛반짝 5s ease-in-out infinite;
    }
    .창문 {
      left: 1.6em; top: 2.2em;
      width: 3.4em; height: 3em;
      border: 0.35em solid var(--창틀);
    }
    .박공창 {                               /* 지붕 삼각형 가운데의 작은 동그란 창 */
      left: 50%; top: 4.1em;
      width: 1.9em; height: 1.9em;
      margin-left: -0.95em;
      border: 0.3em solid var(--창틀);
      border-radius: 50%;
      z-index: 4;
      animation-duration: 6.5s;            /* 창문과 박자를 다르게 → 따로따로 반짝 */
      animation-delay: -2s;
    }

    /* 불빛이 촛불처럼 은근하게 일렁이는 움직임 (불규칙한 간격) */
    @keyframes 불빛반짝 {
      0%, 100% { filter: brightness(1);    opacity: 1; }
      18%      { filter: brightness(0.9);  opacity: 0.92; }
      22%      { filter: brightness(1.05); opacity: 1; }
      47%      { filter: brightness(0.85); opacity: 0.88; }
      53%      { filter: brightness(1);    opacity: 0.97; }
      78%      { filter: brightness(1.08); opacity: 1; }
      84%      { filter: brightness(0.92); opacity: 0.94; }
    }

    /* 창문 불빛이 눈 위에 은은하게 비치는 자리 */
    .불빛번짐 {
      position: absolute;
      left: 50%; bottom: calc(var(--눈높이) - 2.4em);
      font-size: clamp(9px, 1.1vw, 12px);   /* 오두막과 같은 크기 기준 */
      width: 18em; height: 4em;
      margin-left: -12em;                   /* 창문 쪽(왼쪽)으로 */
      background: radial-gradient(ellipse at 50% 40%, rgba(255, 200, 100, 0.35), transparent 70%);
      z-index: 4;
      pointer-events: none;
      animation: 불빛반짝 5s ease-in-out infinite;
    }

    /* 쌓인 눈: 뒤쪽 완만한 언덕 + 앞쪽 울퉁불퉁한 눈더미 */
    .눈더미 {
      position: absolute;
      bottom: 0;
      left: -10%;
      width: 120%;
    }
    .눈더미.뒤 {
      height: calc(var(--눈높이) * 1.15);
      background: linear-gradient(to bottom, #e6eef6, var(--눈그늘));
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      z-index: 1;
    }
    .눈더미.앞 {
      height: var(--눈높이);
      background: linear-gradient(to bottom, #ffffff, var(--눈색) 65%, var(--눈그늘));
      border-radius: 40% 60% 0 0 / 70% 60% 0 0;
      z-index: 3;                           /* 오두막 아랫부분을 덮어요 */
    }
    .눈더미.앞::before, .눈더미.앞::after { /* 작은 눈 언덕 두 개 */
      content: "";
      position: absolute;
      bottom: 40%;
      height: 60%;
      background: linear-gradient(to bottom, #ffffff, var(--눈색));  /* 아래쪽 색을 큰 눈더미와 맞춰 경계가 안 보이게 */
      border-radius: 50%;
    }
    .눈더미.앞::before { left: 12%; width: 22%; }
    .눈더미.앞::after  { right: 10%; width: 26%; }

    /* 움직임 줄이기 설정을 켠 사람에게는 불빛을 반짝이지 않아요 */
    @media (prefers-reduced-motion: reduce) {
      .창문, .박공창, .불빛번짐 { animation: none; }
    }

    /* ===== 좁은 화면(휴대폰) ===== */
    @media (max-width: 720px) {
      .카드판 { grid-template-columns: 1fr; }
      .카드판 .설명 { padding: 0 0 8px; }
      .카드.보라 { grid-column: auto; }
      .음식목록 { gap: 8px; }
    }
  </style>
</head>

<body>
  <!-- 떨어지는 입자를 그리는 캔버스 -->
  <canvas id="입자캔버스" aria-hidden="true"></canvas>

  <main>
    <!-- 맨 위 막대 -->

  <!-- ===== 자바스크립트: 버튼을 눌렀을 때 일어날 일 ===== -->
  <script>
    // 1. 화면에서 필요한 요소들을 id로 찾아서 이름표를 붙여요
    const 사진입력 = document.getElementById('사진입력');
    const 프로필사진 = document.getElementById('프로필사진');
    const 빈자리 = document.getElementById('빈자리');

    // 2. 사진을 보여주고 안내 문구는 숨기는 함수
    function 사진보이기(주소) {
      프로필사진.src = 주소;
      프로필사진.hidden = false;
      빈자리.hidden = true;
    }

    // 3. 기본 사진이 처음부터 보이고, 예전에 직접 골랐던 사진이 저장돼 있으면 그걸로 바꿔요
    try {
      const 저장된사진 = localStorage.getItem('프로필사진');
      if (저장된사진) 사진보이기(저장된사진);
    } catch (오류) { /* 저장소를 못 쓰는 환경이면 그냥 넘어가요 */ }

    // 4. 사용자가 파일을 고르면(change) 아래 내용이 실행돼요
    사진입력.addEventListener('change', function () {
      const 파일 = 사진입력.files[0];
      if (!파일) return;  // 아무것도 안 골랐으면 종료

      const 읽기도구 = new FileReader();
      읽기도구.onload = function () {
        const 원본 = new Image();
        원본.onload = function () {
          // 사진을 가운데 기준 정사각형으로 자르고 400px로 줄여요 (용량 절약)
          const 크기 = 400;
          const 캔버스 = document.createElement('canvas');
          캔버스.width = 크기;
          캔버스.height = 크기;
          const 짧은변 = Math.min(원본.width, 원본.height);
          const x = (원본.width - 짧은변) / 2;
          const y = (원본.height - 짧은변) / 2;
          캔버스.getContext('2d').drawImage(원본, x, y, 짧은변, 짧은변, 0, 0, 크기, 크기);

          const 새주소 = 캔버스.toDataURL('image/jpeg', 0.85);
          사진보이기(새주소);

          // 다음에 페이지를 다시 열어도 보이도록 브라우저에 저장
          try { localStorage.setItem('프로필사진', 새주소); } catch (오류) {}
        };
        원본.src = 읽기도구.result;
      };
      읽기도구.readAsDataURL(파일);  // 파일을 글자 형태의 주소로 읽기
    });

  </script>

  <!-- ===== 자바스크립트: 화면 위에서 아래로 떨어지는 입자 ===== -->
  <script>
    // 뿌연 정도: 입자 반지름의 몇 배까지 빛이 번지게 할지 (클수록 더 뿌옇게)
    const 번짐배수 = 2.5;

    // 스크롤을 올릴 때 떠오르는 효과 설정
    const 떠오름세기 = 0.06;     // 스크롤 1px당 밀어 올리는 힘 (클수록 많이 떠오름)
    const 최대속력 = 6;          // 아무리 빨리 스크롤해도 위로/옆으로 이 속력(px/프레임) 이상은 안 넘게
    const 감속 = 0.92;           // 매 프레임 남는 힘의 비율 (작을수록 빨리 멈춤)
    const 최소각도 = 30;         // 떠오르는 방향: 수평선에서 30도 ~ 150도 사이
    const 최대각도 = 150;        //   → 왼쪽 위 ~ 오른쪽 위, 항상 '위로' 가는 방향만

    // 1. 입자 하나를 나타내는 설계도 (보내주신 코드를 자바스크립트로 옮긴 것)
    class Particle {
      constructor(x, y, radius, deviceWidth) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.aVelocity = 0.01;                       // 좌우로 흔들리는 속도

        this.mass = this.radius / 1.6;               // 떨어지는 속도 (클수록 빨리)
        this.angle = Math.random() * 360 * (Math.PI / 180);  // 흔들림 시작 각도
        this.amplitude = Math.random() * (deviceWidth / 2);  // 좌우로 흔들리는 폭

        // 떠오르기용 값들
        this.vx = 0;          // 떠오를 때의 가로 속도
        this.vy = 0;          // 떠오를 때의 세로 속도 (음수 = 위로)
        this.offsetX = 0;     // 떠오르면서 옆으로 밀려난 거리 (흔들림과 따로 기억)
        this.riseAngle = 90;  // 떠오르는 방향(도)
      }

      // 새 스크롤 동작이 시작될 때마다 떠오를 방향을 무작위로 다시 정해요
      pickRiseAngle() {
        this.riseAngle = 최소각도 + Math.random() * (최대각도 - 최소각도);
      }

      // 스크롤을 올린 만큼 정해진 방향으로 힘을 더해요
      rise(힘) {
        const 라디안 = this.riseAngle * (Math.PI / 180);

        // 세로: 먼저 떨어지는 속도(mass)를 상쇄한 다음, 그만큼 더 위로 밀어요.
        // 그래서 무겁게 빨리 떨어지는 입자도 반드시 위로 움직여요. (캔버스에서는 위가 -방향)
        this.vy = Math.min(this.vy, -this.mass) - 힘;

        // 가로: 정해진 각도만큼 옆으로 (위로 가는 힘 ÷ tan(각도) → 30도면 오른쪽 위, 150도면 왼쪽 위)
        this.vx += 힘 / Math.tan(라디안);

        // 너무 빨라지지 않게 제한
        this.vy = Math.max(this.vy, -(this.mass + 최대속력));
        this.vx = Math.max(-최대속력, Math.min(최대속력, this.vx));
      }

      // 배율: 화면 주사율이 달라도 같은 속도로 움직이게 해주는 값 (60fps일 때 1)
      animation(배율) {
        this.angle += this.aVelocity * 배율;

        // 떠오르는 힘은 매 프레임 조금씩 줄어들어요 → 잠깐 떠올랐다가 다시 떨어짐
        const 남는비율 = Math.pow(감속, 배율);
        this.vx *= 남는비율;
        this.vy *= 남는비율;
        this.offsetX += this.vx * 배율;

        this.x = Math.sin(this.angle) * this.amplitude + this.offsetX;  // 좌우 왕복 + 옆으로 밀린 거리
        this.y += (this.mass + this.vy) * 배율;                          // 떨어지기 + 떠오르는 힘
      }
    }

    // 2. 캔버스 준비
    const 입자캔버스 = document.getElementById('입자캔버스');
    const 붓 = 입자캔버스.getContext('2d');
    const 입자개수 = 40;
    const 입자들 = [];
    let 너비 = 0;
    let 높이 = 0;

    // 캔버스를 화면 크기에 맞추기 (레티나 화면에서도 선명하게)
    function 크기맞추기() {
      const 배수 = window.devicePixelRatio || 1;
      너비 = window.innerWidth;
      높이 = window.innerHeight;
      입자캔버스.width = 너비 * 배수;
      입자캔버스.height = 높이 * 배수;
      붓.setTransform(배수, 0, 0, 배수, 0, 0);
    }

    // 입자들을 화면 맨 위보다 위쪽에 흩어서 만들어요 → 차례차례 위에서 내려와요
    function 입자만들기() {
      입자들.length = 0;
      for (let i = 0; i < 입자개수; i++) {
        const 반지름 = 2 + Math.random() * 4;           // 2px ~ 6px
        const 시작y = -반지름 * 번짐배수 - Math.random() * 높이;   // 화면 위쪽 바깥 (번진 부분까지 안 보이게)
        입자들.push(new Particle(0, 시작y, 반지름, 너비));
      }
    }

    // 3. 매 프레임 실행: 지우고 → 움직이고 → 다시 그리기
    let 이전시간 = performance.now();
    function 그리기(지금) {
      const 배율 = Math.min((지금 - 이전시간) / (1000 / 60), 3);  // 탭을 오래 비웠다 와도 순간이동하지 않게 최대 3
      이전시간 = 지금;

      붓.clearRect(0, 0, 너비, 높이);
      붓.save();
      붓.translate(너비 / 2, 0);  // 기준점을 화면 가운데 위로 옮겨요 (x=0이 화면 가운데가 됨)

      for (const 입자 of 입자들) {
        입자.animation(배율);

        const 번짐 = 입자.radius * 번짐배수;  // 번진 빛까지 포함한 크기

        // 번진 부분까지 화면 맨 아래를 완전히 지나가면 다시 맨 위로
        if (입자.y - 번짐 > 높이) {
          입자.y = -번짐;
        }

        // 가운데는 진한 흰색, 바깥으로 갈수록 투명해지는 동그라미 → 뿌옇게 보여요
        const 흰빛 = 붓.createRadialGradient(입자.x, 입자.y, 0, 입자.x, 입자.y, 번짐);
        흰빛.addColorStop(0,   'rgba(255, 255, 255, 0.9)');  // 한가운데
        흰빛.addColorStop(0.4, 'rgba(255, 255, 255, 0.45)'); // 중간
        흰빛.addColorStop(1,   'rgba(255, 255, 255, 0)');    // 가장자리는 완전히 투명

        붓.beginPath();
        붓.arc(입자.x, 입자.y, 번짐, 0, Math.PI * 2);
        붓.fillStyle = 흰빛;
        붓.fill();
      }

      붓.restore();
      requestAnimationFrame(그리기);
    }

    // 4. 시작 (움직임 줄이기 설정을 켠 사람에게는 실행하지 않아요)
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      크기맞추기();
      입자만들기();
      requestAnimationFrame(그리기);

      // 창 크기가 바뀌면 캔버스도 맞추고, 너비가 바뀌었을 때만 입자를 새로 만들어요
      // (휴대폰에서 스크롤할 때 주소창 때문에 높이만 바뀌는 경우는 그대로 둬요)
      window.addEventListener('resize', function () {
        const 예전너비 = 너비;
        크기맞추기();
        if (너비 !== 예전너비) 입자만들기();
      });

      // 5. 스크롤을 위로 올리면 입자들이 잠깐 떠올라요
      let 이전스크롤 = window.scrollY;
      let 마지막떠오름시간 = 0;
      window.addEventListener('scroll', function () {
        const 지금스크롤 = window.scrollY;
        const 올린거리 = 이전스크롤 - 지금스크롤;  // 양수면 위로 스크롤
        이전스크롤 = 지금스크롤;
        if (올린거리 <= 0) return;                // 아래로 스크롤했거나 그대로면 무시

        // 0.25초 넘게 쉬었다가 다시 올리면 '새 동작' → 방향을 새로 뽑아요
        // (한 번 올리는 동안에는 같은 방향을 유지해서 움직임이 덜덜 떨리지 않게)
        const 지금 = performance.now();
        const 새동작 = 지금 - 마지막떠오름시간 > 250;
        마지막떠오름시간 = 지금;

        const 힘 = Math.min(올린거리, 80) * 떠오름세기;
        for (const 입자 of 입자들) {
          if (새동작) 입자.pickRiseAngle();
          입자.rise(힘 * (0.6 + Math.random() * 0.8));  // 입자마다 힘을 조금씩 다르게
        }
      }, { passive: true });
    }
  </script>
